<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoTurismo — Mapa Turístico Espacial</title>
    
    <!-- Leaflet 1.9.4 CSS -->
    <link 
      rel="stylesheet" 
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
      crossorigin="" 
    />
    
    <!-- CSS da Aplicação -->
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Barra Superior / Header da Aplicação -->
    <header id="app-header">
      <div class="logo-container">
        <span class="logo-icon">🗺️</span>
        <div class="logo-text">
          <h1>GeoTurismo</h1>
          <span class="badge">WebGIS</span>
        </div>
      </div>

      <!-- Área de ações e controles (US01 GPS, US03 Raio, US04 Cadastro) -->
      <div id="header-actions">
        <!-- Indicador de Status dos Pontos / Loading na Viewport (US02) -->
        <div id="points-status-badge" class="points-badge" title="Status dos pontos visíveis na área do mapa">
          <span class="badge-dot" id="badge-status-dot"></span>
          <span id="points-status-text">Inicializando...</span>
        </div>

        <!-- Botão de recentralização na localização atual (US01) -->
        <button id="btn-my-location" class="btn btn-outline" title="Centralizar na minha localização" aria-label="Minha Localização">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="7"></circle>
            <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
            <line x1="12" y1="1" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="23"></line>
            <line x1="1" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="23" y2="12"></line>
          </svg>
          <span class="btn-text">Minha Localização</span>
        </button>

        <!-- Controle de Filtro por Raio (US03) -->
        <div id="radius-control-container" class="radius-control-container" title="Buscar pontos turísticos por raio de proximidade">
          <span class="radius-icon" aria-hidden="true">🎯</span>
          <select id="select-radius" class="select-radius" aria-label="Selecione o raio de proximidade">
            <option value="">Área Visível (Padrão)</option>
            <option value="1">Raio de 1 km</option>
            <option value="2">Raio de 2 km</option>
            <option value="5">Raio de 5 km</option>
            <option value="10">Raio de 10 km</option>
            <option value="20">Raio de 20 km</option>
            <option value="50">Raio de 50 km</option>
          </select>
          <button id="btn-clear-radius" class="btn-clear-radius hidden" title="Limpar filtro de raio e voltar à área visível" aria-label="Limpar filtro de raio">
            ✕
          </button>
        </div>

        <!-- Placeholder para Controles Futuros: US04 (Novo Ponto - Dev 3) -->
        <div id="crud-control-placeholder" class="header-slot"></div>
      </div>
    </header>

    <!-- Container do Mapa Full-Screen -->
    <main id="map-container">
      <div id="map"></div>
    </main>

    <!-- Container de Notificações Toast Flutuante -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Leaflet 1.9.4 JS (CDN) -->
    <script 
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
      crossorigin=""
    ></script>

    <!-- Script Principal da Aplicação -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
